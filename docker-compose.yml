services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  inbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-agent-inbox:local
    restart: unless-stopped
    user: "${INBOX_UID:-1000}:${INBOX_GID:-1000}"
    ports:
      - "${INBOX_PORT:-8000}:8000"
    environment:
      INBOX_APP_HOST: 0.0.0.0
      INBOX_APP_PORT: 8000
      INBOX_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      INBOX_CONFIG_PATH: /app/data/inbox_config.json
    volumes:
      - "./data:/app/data"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
